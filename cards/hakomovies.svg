<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-label="hakomovies: Movie browser on the TMDB API.">
<style>
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .bob { animation: bob 1.4s steps(2) infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .blink { opacity: 0; animation: blink 4.5s infinite; }
  @keyframes blink { 0%,91%,100% { opacity: 0; } 93%,96% { opacity: 1; } }
  .cursor { animation: cursor 1s steps(1) infinite; }
  @keyframes cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
</style>
